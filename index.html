<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B2B Tech Stack & Quote Estimator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Font: JetBrains Mono (Italic Monospace Spreadsheet Vibe) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
  
  <style>
    * {
      font-family: 'JetBrains Mono', monospace;
      font-style: italic;
    }
    body {
      background-color: #0f172a; /* Deep Charcoal Slate Background (Zero Blue) */
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-10 flex flex-col justify-between">

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto w-full border border-slate-700/80 rounded-xl p-6 md:p-8 bg-slate-900/90 shadow-2xl backdrop-blur">
    
    <!-- Header Section -->
    <header class="border-b border-slate-700 pb-4 mb-6 flex justify-between items-center flex-wrap gap-2">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold italic text-emerald-400">// B2B_Quote_Estimator.xlsx</h1>
        <p class="text-xs md:text-sm text-slate-400 italic mt-1">Client-side tech stack pricing & effort scope generator.</p>
      </div>
      <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-700/60 px-3 py-1 rounded-full italic font-semibold">
        100% Client-Side SaaS
      </span>
    </header>

    <!-- Controls / Meta Inputs -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div>
        <label for="clientName" class="block text-xs text-slate-400 italic mb-2">[Client / Target Company]</label>
        <input id="clientName" type="text" value="Acme Corp Solutions" placeholder="Client Name" class="w-full bg-slate-800/80 border border-slate-700 rounded p-3 text-sm focus:border-emerald-500 outline-none italic text-slate-100 transition" oninput="updateCalculations()" />
      </div>
      <div>
        <label for="hourlyRate" class="block text-xs text-slate-400 italic mb-2">[Agency Hourly Rate ($ USD)]</label>
        <input id="hourlyRate" type="number" value="60" min="0" class="w-full bg-slate-800/80 border border-slate-700 rounded p-3 text-sm focus:border-emerald-500 outline-none italic text-slate-100 transition" oninput="updateCalculations()" />
      </div>
    </section>

    <!-- Spreadsheet Matrix Table -->
    <section class="border border-slate-700 rounded-lg overflow-x-auto mb-6">
      <table class="w-full text-left text-sm italic">
        <thead class="bg-slate-800 text-slate-400 border-b border-slate-700">
          <tr>
            <th class="p-3">MODULE / TECH SCOPE</th>
            <th class="p-3 text-center">EST. HOURS</th>
            <th class="p-3 text-right">CALCULATED COST ($)</th>
            <th class="p-3 text-center w-12">ACTION</th>
          </tr>
        </thead>
        <tbody id="calculatorTableBody" class="divide-y divide-slate-800 bg-slate-900/50">
          <!-- Dynamically Injected Rows -->
        </tbody>
      </table>
    </section>

    <!-- Add Row Controls -->
    <div class="mb-6">
      <button onclick="addNewRow()" class="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 hover:border-emerald-500/50 px-4 py-2 rounded text-xs italic transition flex items-center gap-2">
        <span>+</span> Add Custom Module
      </button>
    </div>

    <!-- Summary Output Card -->
    <section class="border-t border-slate-700 pt-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <span class="text-xs text-slate-400 block italic">// TOTAL ESTIMATED PROPOSAL</span>
        <span id="summaryText" class="text-sm text-slate-300 italic font-medium">Prepared for: Acme Corp Solutions</span>
      </div>
      <div class="text-right">
        <span id="totalCost" class="text-3xl md:text-4xl font-bold italic
